name: 发布 - 构建和发布新版本

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: 构建 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        include:
          - os: windows-latest
            # Windows默认就是这个目标，无需指定
            artifact: claude_code_rs.exe
            asset_name: claude-code-rust-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      - name: 构建 Release
        # 移除了无用的 --target，使用默认路径
        run: cargo build --release
      
      - name: 上传资源到 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          # 【核心修复】正确的Windows构建产物路径
          files: target/release/${{ matrix.artifact }}
        env:
          # 必须添加GitHub令牌，否则无权限创建/上传Release
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
