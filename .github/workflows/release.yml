name: 发布 - 构建和发布新版本

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: 构建 Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      - name: 构建 Release
        run: cargo build --release

      # 👇 新增：查看编译出来的文件到底叫什么
      - name: 查看生成的文件
        run: dir target/release/*.exe

      # 👇 上传（使用通配符 * 自动匹配，不管叫什么都能找到）
      - name: 上传到 Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/release/*.exe  # 通配符，自动匹配
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
